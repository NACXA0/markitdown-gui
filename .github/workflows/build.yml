name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl fuse libfuse2
      - name: Build
        run: bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: markitdown-gui-artifacts
          path: |
            dist/**
          if-no-files-found: warn

  linux-arm-placeholder:
    runs-on: ubuntu-22.04
    steps:
      - run: echo "ARM packaging placeholder — build on aarch64 host when ready."

  linux-rpm-placeholder:
    runs-on: ubuntu-22.04
    steps:
      - run: echo "RPM packaging placeholder."

  windows-exe-placeholder:
    runs-on: windows-latest
    steps:
      - run: echo "Windows exe placeholder — use uv sync && flet build windows / pyinstaller on Windows."

  macos-app-placeholder:
    runs-on: macos-latest
    steps:
      - run: echo "macOS .app placeholder — use uv sync && flet build macos on macOS."
