[project]
name = "markitdown-gui"
version = "0.1.0"
description = "Desktop GUI for Microsoft MarkItDown, built with Flet"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet[all]>=1.0.0",
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook,audio-transcription,youtube-transcription]>=0.1.3",
    "youtube-transcript-api>=1.2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "flet-dropzone",
]

[project.scripts]
markitdown-gui = "main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
flet-dropzone = { path = "vendor/flet-dropzone" }

[tool.flet]
product = "MarkItDown GUI"
artifact = "markitdown-gui"
desktop_flavor = "light"

[tool.flet.app]
exclude = [
    ".git",
    ".github",
    ".venv",
    ".vscode",
    ".cursor",
    ".flet",
    "dist",
    "vendor",
    "scripts",
    "uv.lock",
    "提示词缓存.md",
]

# Skip package bytecode compile during packaging — saves /tmp space and avoids
# long compileall passes that previously aborted this project's Linux builds.
[tool.flet.compile]
packages = false

[tool.flet.dev_packages]
flet-dropzone = "vendor/flet-dropzone"

[tool.flet.linux]
categories = ["Utility", "Office"]
