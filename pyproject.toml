[project]
name = "markitdown-gui"
version = "0.1.0"
description = "Desktop GUI for Microsoft MarkItDown, built with Flet"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "flet[all]>=1.0.0",
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook,audio-transcription,youtube-transcription]>=0.1.3",
    "youtube-transcript-api>=1.2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "flet-dropzone",
]

[project.scripts]
markitdown-gui = "main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
flet-dropzone = { path = "vendor/flet-dropzone" }

[tool.flet]
product = "MarkItDown GUI"
artifact = "markitdown-gui"
desktop_flavor = "light"

[tool.flet.app]
exclude = [
    ".git",
    ".github",
    ".venv",
    ".vscode",
    ".cursor",
    ".flet",
    "dist",
    "vendor",
    "scripts",
    "uv.lock",
    "提示词缓存.md",
]

# 打包时跳过 Python 字节码编译——节省 /tmp 空间，并避免此前导致本项目 Linux 构建中断的长时间 compileall。
[tool.flet.compile]
packages = false

[tool.flet.dev_packages]
flet-dropzone = "vendor/flet-dropzone"

[tool.flet.linux]
categories = ["Utility", "Office"]
